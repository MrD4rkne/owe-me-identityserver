name: oweme-system

x-database-common: &db-common
    POSTGRES_DB: OweMe.Identity
    POSTGRES_USER: sa
    POSTGRES_PASSWORD: Password123

services:
    oweme.identity.database:
        image: "postgres:15"
        container_name: oweme.identity.database
        ports:
            - "5432:5432"
        environment:
            <<: *db-common
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U sa -d OweMe.Identity"]
            interval: 10s
            timeout: 5s
            retries: 5

    oweme.identity.migrator:
        image: oweme.identity
        container_name: oweme.identity.migrator
        entrypoint: ["dotnet", "/app/migrator/OweMe.Identity.Migrator.dll", "migrate"]
        environment:
            <<: *db-common
            MIGRATIONS_CONNECTION_STRING: Host=oweme.identity.database;Database=OweMe.Identity;Username=sa;Password=Password123;
        depends_on:
            oweme.identity.database:
                condition: service_healthy

    oweme.identity:
        image: oweme.identity
        container_name: oweme.identity
        ports:
            - "5010:8080"
            - "5011:8081"
        environment:
            <<: *db-common
            ConnectionStrings__DefaultConnection: Host=oweme.identity.database;Database=OweMe.Identity;Username=sa;Password=Password123;
        depends_on:
            oweme.identity.migrator:
                condition: service_completed_successfully
            oweme.identity.database:
                condition: service_healthy
